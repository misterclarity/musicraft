name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web app and score engine
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  e2e:
    name: End-to-end tests (${{ matrix.host }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Served at / with the production headers from vercel.json/netlify.toml.
          - host: Netlify
            base: /
          # Served under the repository name, without custom headers (the <meta> CSP applies).
          - host: GitHub Pages
            base: /musicraft/
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - run: npm run build
        env:
          BASE_PATH: ${{ matrix.base }}
      - run: npm run e2e
        env:
          E2E_BASE_PATH: ${{ matrix.base }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results-${{ strategy.job-index }}
          path: apps/web/test-results
          retention-days: 7

  omr:
    name: Recognition service
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/omr
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --group dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q

  omr-image:
    name: Recognition service image (CPU)
    runs-on: ubuntu-latest
    needs: omr
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: services/omr
          file: services/omr/Dockerfile
          push: false
          tags: musicraft-omr:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
