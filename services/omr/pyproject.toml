[project]
name = "musicraft-omr"
version = "0.1.0"
description = "Optical music recognition service for Musicraft: turns page images and PDFs into MusicXML using homr."
readme = "README.md"
license = "GPL-3.0-only"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "python-multipart>=0.0.9",
  "numpy>=2,<3",
  "pillow>=11,<13",
  "pillow-heif>=0.18",
  "pypdfium2>=4,<6",
  # homr requires OpenCV 4.x; keep the same range so both install side by side.
  "opencv-python-headless>=4.10,<5",
]

[project.scripts]
musicraft-omr = "musicraft_omr.__main__:main"

[dependency-groups]
dev = [
  "pytest>=8",
  "httpx>=0.27",
  "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["musicraft_omr"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
